name: build-images

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Unit tests gate image publishing: `build` needs this job and `integration`,
  # so a failing test means no images. Lint stays informational (its step may
  # fail without failing the job) — see CLAUDE.md "Linting".
  test:
    runs-on: ubuntu-latest
    # For later workflow conditions: `fail`, `pass`, or `report-only` (no
    # minimums set), and the overall percentages (or `N/A`).
    outputs:
      coverage_result: ${{ steps.coverage.outputs.result }}
      coverage_lines: ${{ steps.coverage.outputs.lines }}
      coverage_branches: ${{ steps.coverage.outputs.branches }}
      coverage_functions: ${{ steps.coverage.outputs.functions }}
      coverage_statements: ${{ steps.coverage.outputs.statements }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint before tests. Flat config in eslint.config.mjs; non-type-checked,
      # so it needs no prisma generate. Informational: does not gate the build.
      - run: pnpm lint
        continue-on-error: true
      # Tests compile against the generated Prisma client (enums, Decimal,
      # typed transactions) — without this every suite fails with TS2305.
      - run: pnpm --filter @wholo/api exec prisma generate
      - run: pnpm --filter @wholo/admin-api exec prisma generate
      # The unit tests, run once, with coverage — the same command as locally
      # (docs/testing/coverage.md). Fails on a failed test, and on coverage only
      # once a minimum is set: the COVERAGE_MIN_* repository variables override
      # coverage.thresholds.json; with none set this is reporting only. Writes
      # the per-package table to the run Summary either way.
      - id: coverage
        run: pnpm test:coverage
        env:
          COVERAGE_MIN_LINES: ${{ vars.COVERAGE_MIN_LINES }}
          COVERAGE_MIN_BRANCHES: ${{ vars.COVERAGE_MIN_BRANCHES }}
          COVERAGE_MIN_FUNCTIONS: ${{ vars.COVERAGE_MIN_FUNCTIONS }}
          COVERAGE_MIN_STATEMENTS: ${{ vars.COVERAGE_MIN_STATEMENTS }}
      # Whatever was produced is published, including after a test failure.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            coverage/
            apps/*/coverage/
            packages/*/coverage/

  # apps/api integration specs (test/*.integration-spec.ts): each boots the
  # real NestJS app in-process and drives it over HTTP (supertest) against a
  # real database — the only proof of tenant isolation, constraints and
  # routes. Nothing external is called: tokens are signed by a local test key
  # server, R2 is mocked, and no accounting provider is contacted, so every
  # value below is a throwaway. Gates image publishing, like `test`.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # Same image as the cluster (helm/wholo/values.yaml) — the migrations
      # create TimescaleDB hypertables, so plain Postgres will not do.
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: wholo
          POSTGRES_PASSWORD: wholo
          POSTGRES_DB: wholo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wholo -d wholo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://wholo:wholo@localhost:5432/wholo?connection_limit=10
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-only-not-a-secret
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: "30"
      ADMIN_URL: http://localhost:3020
      PORTAL_URL: http://localhost:3010
      DRIVER_APP_URL: http://localhost:3030
      R2_ACCOUNT_ID: ci
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_BUCKET_NAME: ci-assets
      R2_DELIVERY_BUCKET_NAME: ci-delivery
      R2_PUBLIC_BASE_URL: https://cdn.example.com
      XERO_CLIENT_ID: ci
      XERO_CLIENT_SECRET: ci
      XERO_REDIRECT_URI: https://admin.localhost:8443/api/v1/accounting/xero/callback
      # 32 zero bytes, base64 — the shape the app validates; protects nothing.
      ACCOUNTING_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DELIVERY_TOKEN_SIGNING_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wholo/api exec prisma generate
      # Workspace packages the API imports resolve to their built output.
      - run: pnpm turbo build --filter=@wholo/api^...
      # The schema exactly as production gets it: every migration, from empty.
      - run: pnpm --filter @wholo/api exec prisma migrate deploy
      # --forceExit: a spec that leaves a handle open must not hang the job.
      - run: pnpm --filter @wholo/api test:integration --forceExit

  build:
    # No images unless the unit and integration tests pass.
    needs: [test, integration]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # context: the monorepo images build from the repo root (they copy
          # workspace packages); the keycloak image builds from its own dir.
          - name: api
            dockerfile: apps/api/Dockerfile
            context: .
            build-args: ""
          # NEXT_PUBLIC_* values are baked into the Next.js bundle at image
          # build time, so BFF images are environment-specific: these are
          # LIVE images. Local dev keeps building its own :local images.
          - name: portal-api
            dockerfile: apps/portal-api/Dockerfile
            context: .
            build-args: |
              NEXT_PUBLIC_KEYCLOAK_URL=${{ vars.LIVE_KEYCLOAK_URL || 'http://localhost:8080' }}
              NEXT_PUBLIC_KEYCLOAK_REALM=${{ vars.LIVE_KEYCLOAK_REALM || 'wholo' }}
              NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=wholo-portal
          - name: admin-api
            dockerfile: apps/admin-api/Dockerfile
            context: .
            build-args: |
              NEXT_PUBLIC_KEYCLOAK_URL=${{ vars.LIVE_KEYCLOAK_URL || 'http://localhost:8080' }}
              NEXT_PUBLIC_KEYCLOAK_REALM=${{ vars.LIVE_KEYCLOAK_REALM || 'wholo' }}
              NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=wholo-admin
          # Driver PWA is baked into driver-api. No NEXT_PUBLIC_* build args —
          # the driver app has no login yet (see apps/driver-api/Dockerfile).
          - name: driver-api
            dockerfile: apps/driver-api/Dockerfile
            context: .
            build-args: ""
          # Public marketing site — standalone Next.js, no BFF. Site URL is
          # injected at runtime via the ConfigMap; analytics + A/B are baked
          # into the static build (repo Variables, blank => off for local).
          - name: www
            dockerfile: apps/www/Dockerfile
            context: .
            build-args: |
              PLAUSIBLE_ENABLED=${{ vars.WWW_PLAUSIBLE_ENABLED }}
              PLAUSIBLE_DOMAIN=${{ vars.WWW_PLAUSIBLE_DOMAIN || 'stocdup.com' }}
              EXPERIMENT_HERO_VARIANTS=${{ vars.WWW_EXPERIMENT_HERO_VARIANTS }}
          - name: keycloak
            dockerfile: apps/keycloak/Dockerfile
            context: apps/keycloak
            build-args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Inlined instead of docker/metadata-action: all we need is two tag
      # strings, and metadata-action has been failing outright (HTML error
      # page instead of JSON) regardless of action version. Root cause turned
      # out to be a GitHub REST API availability degradation (see
      # githubstatus.com), not the action itself — TODO once that's resolved,
      # consider reverting to docker/metadata-action for its fuller feature
      # set (OCI labels etc.), since this inline version only covers the two
      # tag patterns we actually use.
      - id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${{ matrix.name }}"
          TAGS="${IMAGE}:sha-${GITHUB_SHA::7}"
          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.name }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max', github.repository, matrix.name) || '' }}
