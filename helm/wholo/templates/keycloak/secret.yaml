apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wholo.fullname" . }}-keycloak
  labels:
    app: {{ include "wholo.fullname" . }}-keycloak
type: Opaque
stringData:
  # Creates the master-realm admin on an empty database only (first boot).
  # KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD were deprecated in Keycloak 26.0.
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.adminUser | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
  KC_DB_PASSWORD: {{ .Values.postgresql.password | quote }}
