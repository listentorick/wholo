apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wholo.fullname" . }}-api
  labels:
    app: {{ include "wholo.fullname" . }}-api
type: Opaque
# `data`, not `stringData`: Kubernetes merges stringData into data and never
# removes from it, so a key deleted from a stringData template stays in the
# live Secret (and in every pod's environment) for ever. With `data`, removing
# a line here removes the key on the next upgrade.
data:
  DATABASE_URL: {{ include "wholo.postgresql.url" . | b64enc | quote }}
  R2_ACCESS_KEY_ID: {{ .Values.api.r2.accessKeyId | b64enc | quote }}
  R2_SECRET_ACCESS_KEY: {{ .Values.api.r2.secretAccessKey | b64enc | quote }}
  XERO_CLIENT_SECRET: {{ .Values.api.xero.clientSecret | b64enc | quote }}
  ACCOUNTING_TOKEN_ENCRYPTION_KEY: {{ .Values.api.accountingTokenEncryptionKey | b64enc | quote }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ .Values.keycloak.apiAdminClientSecret | b64enc | quote }}
  SMTP_USER: {{ .Values.api.smtp.user | b64enc | quote }}
  SMTP_PASS: {{ .Values.api.smtp.password | b64enc | quote }}
