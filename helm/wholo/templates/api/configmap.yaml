apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wholo.fullname" . }}-api
  labels:
    app: {{ include "wholo.fullname" . }}-api
data:
  PORT: "3001"
  NODE_ENV: "production"
  APP_ENV: {{ .Values.appEnv | default "local" | quote }}
  # `service` label on every metric this process emits (ADR-063/065).
  SERVICE_NAME: "api"
  # Structured logging level (ADR-064).
  LOG_LEVEL: {{ .Values.logging.level | default "info" | quote }}
  {{- if .Values.telegraf.enabled }}
  # Order-activity counters (ADR-062) go to the in-cluster Telegraf over
  # StatsD/UDP; unset ⇒ MetricsService is a silent no-op. (The worker shares
  # this ConfigMap but emits nothing over StatsD.)
  STATSD_HOST: {{ include "wholo.telegraf.host" . | quote }}
  STATSD_PORT: "8125"
  {{- if .Values.telegraf.platformHealth.enabled }}
  # Platform-health metrics (ADR-065): prom-client served on this port at
  # /metrics for Telegraf's scrape; unset ⇒ no metrics server. The worker
  # inherits it too.
  METRICS_PORT: {{ include "wholo.metrics.port" . | quote }}
  {{- end }}
  {{- end }}
  REDIS_URL: {{ printf "redis://%s:%d" (include "wholo.redis.host" .) (int .Values.redis.port) | quote }}
  KEYCLOAK_URL: {{ printf "http://%s:%d" (include "wholo.keycloak.host" .) (int .Values.keycloak.port) | quote }}
  KEYCLOAK_REALM: {{ .Values.keycloak.realm | quote }}
  KEYCLOAK_ADMIN_CLIENT_ID: "wholo-api-admin"
  R2_ACCOUNT_ID: {{ .Values.api.r2.accountId | quote }}
  R2_BUCKET_NAME: {{ .Values.api.r2.bucketName | quote }}
  R2_DELIVERY_BUCKET_NAME: {{ .Values.api.r2.deliveryBucketName | quote }}
  R2_PUBLIC_BASE_URL: {{ .Values.api.r2.publicBaseUrl | quote }}
  PORTAL_URL: {{ .Values.global.portalUrl | quote }}
  ADMIN_URL: {{ .Values.global.adminUrl | quote }}
  DRIVER_APP_URL: {{ .Values.global.driverUrl | quote }}
  XERO_CLIENT_ID: {{ .Values.api.xero.clientId | quote }}
  XERO_REDIRECT_URI: {{ .Values.api.xero.redirectUri | quote }}
  SMTP_HOST: {{ .Values.api.smtp.host | default (printf "%s-mailhog" (include "wholo.fullname" .)) | quote }}
  SMTP_PORT: {{ .Values.api.smtp.port | default "1025" | toString | quote }}
  SMTP_SECURE: {{ .Values.api.smtp.secure | default "false" | toString | quote }}
  SMTP_FROM: {{ .Values.api.smtp.from | default "noreply@wholo.com.au" | quote }}
  SMTP_INVITE_FROM: {{ .Values.api.smtp.inviteFrom | default .Values.api.smtp.from | default "noreply@wholo.com.au" | quote }}
  SMTP_SUPPORT_EMAIL: {{ .Values.api.smtp.supportEmail | default "support@stocdup.com" | quote }}
