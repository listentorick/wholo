{{- if .Values.opsApi.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wholo.fullname" . }}-ops-api
  labels:
    app: {{ include "wholo.fullname" . }}-ops-api
type: Opaque
# No secrets: this BFF reaches data only through apps/api (ADR-026) and
# verifies Keycloak tokens with public keys (ADR-049).
data: {}
{{- end }}
