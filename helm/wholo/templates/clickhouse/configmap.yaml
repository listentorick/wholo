{{- if .Values.plausible.enabled }}
# Plausible's recommended ClickHouse tuning: drop the log tables that otherwise
# grow unbounded on a small disk. See plausible.io/docs/self-hosting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wholo.fullname" . }}-clickhouse
  labels:
    app: {{ include "wholo.fullname" . }}-clickhouse
data:
  logging.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console>true</console>
      </logger>
      <query_thread_log remove="remove"/>
      <query_log remove="remove"/>
      <text_log remove="remove"/>
      <trace_log remove="remove"/>
      <metric_log remove="remove"/>
      <asynchronous_metric_log remove="remove"/>
      <session_log remove="remove"/>
      <part_log remove="remove"/>
    </clickhouse>
  user-logging.xml: |
    <clickhouse>
      <profiles>
        <default>
          <log_queries>0</log_queries>
          <log_query_threads>0</log_query_threads>
        </default>
      </profiles>
    </clickhouse>
{{- end }}
