apiVersion: v1
kind: Service
metadata:
  name: {{ include "wholo.fullname" . }}-help
  labels:
    app: {{ include "wholo.fullname" . }}-help
spec:
  type: {{ .Values.help.service.type }}
  selector:
    app: {{ include "wholo.fullname" . }}-help
  ports:
    - name: http
      port: {{ .Values.help.service.port }}
      targetPort: 3060
