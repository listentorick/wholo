apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wholo.fullname" . }}-help
  labels:
    app: {{ include "wholo.fullname" . }}-help
spec:
  replicas: {{ .Values.help.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "wholo.fullname" . }}-help
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ include "wholo.fullname" . }}-help
    spec:
      {{- include "wholo.imagePullSecrets" . }}
      containers:
        - name: help
          image: {{ .Values.help.image.repository }}:{{ .Values.help.image.tag }}
          imagePullPolicy: {{ .Values.help.image.pullPolicy }}
          ports:
            - containerPort: 3060
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3060
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3060
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.help.resources | nindent 12 }}
