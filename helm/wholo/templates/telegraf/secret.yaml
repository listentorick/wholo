{{- if .Values.telegraf.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wholo.fullname" . }}-telegraf
  labels:
    app: {{ include "wholo.fullname" . }}-telegraf
type: Opaque
stringData:
  # Live: a write-scoped InfluxDB token (telegraf.influx.token). Local: falls
  # back to the in-cluster InfluxDB admin token (influxdb.adminToken).
  INFLUX_TOKEN: {{ required "telegraf.influx.token (or influxdb.adminToken) is required when telegraf.enabled" (include "wholo.telegraf.influxToken" .) | quote }}
{{- end }}
