{{- if .Values.telegraf.enabled }}
# Order-activity telemetry (ADR-062), backup health (ADR-069) and core
# platform-health metrics (ADR-063, transport per ADR-065). Receives StatsD over
# UDP (order counters, backup gauges) and, when platformHealth is on, scrapes
# every process's /metrics (HTTP + queue metrics) and polls each API's /health
# and the Kubernetes API. Forwards everything to InfluxDB 2. Environment
# variables (${INFLUX_*}) are injected by the Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wholo.fullname" . }}-telegraf
  labels:
    app: {{ include "wholo.fullname" . }}-telegraf
data:
  telegraf.conf: |
    [agent]
      interval = {{ .Values.telegraf.flushInterval | default "10s" | quote }}
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      flush_interval = {{ .Values.telegraf.flushInterval | default "10s" | quote }}
      flush_jitter = "2s"
      omit_hostname = true

    # Stamped on every metric that does not already carry it. App-emitted StatsD
    # lines and scraped /metrics series carry their own `environment` (from
    # APP_ENV) — Telegraf never overrides a metric's own tag — so this only fills
    # it in for Telegraf's own inputs (http_response, kube_inventory).
    [global_tags]
      environment = {{ .Values.appEnv | default "local" | quote }}

    # StatsD senders: apps/api's order-activity counters (ADR-062,
    # `name,tag=value,...:N|c`) and the pg-backup CronJob's gauges (ADR-069,
    # `|g`). Counters are dropped after each flush so a quiet period reports
    # nothing rather than a stale value. Gauges are KEPT (delete_gauges = false):
    # the backup job runs every 6h and exits, and its last-run / last-success
    # gauges must keep reporting in between — the backup dashboard and
    # alerts depend on it.
    [[inputs.statsd]]
      protocol = "udp"
      service_address = ":8125"
      delete_counters = true
      delete_gauges = false
      delete_sets = true
      allowed_pending_messages = 10000

    # Telegraf's own buffer / write-error counters — a debugging aid when the
    # InfluxDB output starts failing.
    [[inputs.internal]]
{{- if .Values.telegraf.platformHealth.enabled }}

    # ── ADR-065: HTTP + BullMQ queue metrics, scraped from each process ──────
    # prom-client instruments on a cluster-internal :9464/metrics per process
    # (the `<release>-<name>-metrics` ClusterIP Services). Counters/histograms
    # are cumulative since process start: a missed scrape loses resolution,
    # never events. metric_version = 2 writes measurement `prometheus`, one
    # field per metric name, prom labels (environment, service, method, …) as
    # tags, histogram buckets as `<name>_bucket` with an `le` tag.
    #
    # Static Service URLs are only deterministic while each app runs ONE
    # replica (true today; the worker is pinned to 1). If an app ever scales
    # out, a Service scrape hits a random pod and cumulative-counter math breaks
    # — switch to pod discovery then (ADR-065).
    [[inputs.prometheus]]
      interval = "15s"
      metric_version = 2
      response_timeout = "5s"
      urls = [
      {{- range $name := splitList " " (include "wholo.metrics.targets" .) }}
        "http://{{ include "wholo.fullname" $ }}-{{ $name }}-metrics:{{ include "wholo.metrics.port" $ }}/metrics",
      {{- end }}
      ]

    # ── ADR-063: per-API availability + latency self-checks (no app code) ──────
    # Polls the Service, so this measures "≥1 ready replica answered". Per-pod
    # health comes from inputs.kube_inventory below.
    [[inputs.http_response]]
      interval = "15s"
      urls = ["http://{{ include "wholo.fullname" . }}-api:{{ .Values.api.service.port }}/api/v1/health"]
      method = "GET"
      response_timeout = "5s"
      [inputs.http_response.tags]
        service = "api"

    [[inputs.http_response]]
      interval = "15s"
      urls = ["http://{{ include "wholo.fullname" . }}-admin-api:{{ .Values.adminApi.service.port }}/api/v1/health"]
      method = "GET"
      response_timeout = "5s"
      [inputs.http_response.tags]
        service = "admin-api"

    [[inputs.http_response]]
      interval = "15s"
      urls = ["http://{{ include "wholo.fullname" . }}-portal-api:{{ .Values.portalApi.service.port }}/api/v1/health"]
      method = "GET"
      response_timeout = "5s"
      [inputs.http_response.tags]
        service = "portal-api"

    [[inputs.http_response]]
      interval = "15s"
      urls = ["http://{{ include "wholo.fullname" . }}-driver-api:{{ .Values.driverApi.service.port }}/api/v1/health"]
      method = "GET"
      response_timeout = "5s"
      [inputs.http_response.tags]
        service = "driver-api"

    # ── ADR-063: pod availability + container restarts (Kubernetes API) ───────
    # Uses the mounted ServiceAccount token; RBAC is telegraf/rbac.yaml.
    [[inputs.kube_inventory]]
      interval = "30s"
      url = "https://kubernetes.default.svc"
      bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      # Verify the API server against the ServiceAccount CA bundle the kubelet
      # mounts into every pod — no reason to skip TLS verification in-cluster.
      tls_ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      insecure_skip_verify = false
      namespace = {{ .Release.Namespace | quote }}
      resource_include = ["pods", "nodes", "deployments"]
{{- end }}

    [[outputs.influxdb_v2]]
      urls = ["${INFLUX_URL}"]
      token = "${INFLUX_TOKEN}"
      organization = "${INFLUX_ORG}"
      bucket = "${INFLUX_BUCKET}"
      # Write failures log at ERROR to stderr -> pod logs (HTTP status only,
      # never metric payload text).

    # HTTP 200 while the output buffer is healthy, 503 when it backs up —
    # drives the Deployment's liveness/readiness probes.
    [[outputs.health]]
      service_address = "http://:8080"
      [[outputs.health.compares]]
        field = "buffer_size"
        lt = 10000.0
{{- end }}
