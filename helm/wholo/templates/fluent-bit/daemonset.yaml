{{- if .Values.fluentBit.enabled }}
# Log shipping (ADR-064). One Fluent Bit per node tailing /var/log/pods; ships
# to the in-cluster Loki (local) or the ops-host Loki (live, fluentBit.loki.host).
# Read-only host log mounts, a writable hostPath position DB, not privileged.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "wholo.fullname" . }}-fluent-bit
  labels:
    app: {{ include "wholo.fullname" . }}-fluent-bit
spec:
  selector:
    matchLabels:
      app: {{ include "wholo.fullname" . }}-fluent-bit
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ include "wholo.fullname" . }}-fluent-bit
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/fluent-bit/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "wholo.imagePullSecrets" . }}
      serviceAccountName: {{ include "wholo.fullname" . }}-fluent-bit
      # Ship the control-plane node's own pods too (k3s servers are schedulable).
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: {{ .Values.fluentBit.image }}
          args: ["--config=/fluent-bit/etc/fluent-bit.conf"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: APP_ENV
              value: {{ .Values.appEnv | default "local" | quote }}
            - name: LOKI_HOST
              value: {{ include "wholo.loki.pushHost" . | quote }}
            - name: LOKI_PORT
              value: {{ .Values.fluentBit.loki.port | default 3100 | quote }}
            - name: LOKI_URI
              value: {{ .Values.fluentBit.loki.uri | default "/loki/api/v1/push" | quote }}
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            # cri-dockerd (Docker Desktop) symlinks pod logs into here; empty and
            # harmless on a containerd node.
            - name: dockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: state
              mountPath: /var/fluent-bit/state
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.fluentBit.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "wholo.fullname" . }}-fluent-bit
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: DirectoryOrCreate
        - name: dockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: {{ .Values.fluentBit.positionsHostPath | default "/var/lib/wholo-fluent-bit" | quote }}
            type: DirectoryOrCreate
{{- end }}
