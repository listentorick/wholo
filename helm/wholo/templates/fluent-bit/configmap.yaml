{{- if .Values.fluentBit.enabled }}
# Log shipping (ADR-064). Tails the release namespace's container logs (local:
# `default`, live: `wholo`), enriches with k8s metadata, parses the JSON body
# from the Node processes, and pushes everything to Loki. Non-JSON sources
# (keycloak, postgres, www, ...) pass through with `message` intact and a
# synthetic level=info.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wholo.fullname" . }}-fluent-bit
  labels:
    app: {{ include "wholo.fullname" . }}-fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush              5
        Daemon             Off
        Log_Level          info
        Parsers_File       parsers.conf
        HTTP_Server        On
        HTTP_Listen        0.0.0.0
        HTTP_Port          2020
        Health_Check       On
        HC_Errors_Count    5
        HC_Retry_Failure_Count 5
        HC_Period          60
        storage.metrics    On

    # `*_{{ .Release.Namespace }}_*` scopes to this release's namespace — the
    # container-log filename is <pod>_<namespace>_<container>-<id>.log (a symlink
    # chain into /var/log/pods and, on a docker runtime, /var/lib/docker).
    # multiline.parser is `cri` in live (containerd) / `docker` locally
    # (cri-dockerd json-file) — fluentBit.multilineParser.
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_{{ .Release.Namespace }}_*.log
        Exclude_Path      /var/log/containers/*wholo-fluent-bit*.log
        multiline.parser  {{ .Values.fluentBit.multilineParser | default "cri" }}
        DB                /var/fluent-bit/state/flb.db
        DB.locking        true
        Mem_Buf_Limit     16MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        # Read new files from the start (so a fresh install captures existing
        # log content, incl. boot logs); the hostPath position DB means a
        # restart resumes rather than re-reads.
        Read_from_Head    On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           Off
        Keep_Log            On
        K8S-Logging.Parser  Off
        K8S-Logging.Exclude Off
        Labels              On
        Annotations         Off
        Buffer_Size         64k

    # cri parser -> `message`; docker parser -> `log`. Normalise to `message`
    # (Rename is a no-op when the source key is absent).
    [FILTER]
        Name    modify
        Match   kube.*
        Rename  log message

    # Parse the JSON body from the 5 Node processes into top-level fields
    # (level, msg, context, reqId, ...). Non-JSON lines are left untouched.
    [FILTER]
        Name          parser
        Match         kube.*
        Key_Name      message
        Parser        json_app
        Reserve_Data  On
        Preserve_Key  Off

    # pino emits `msg`; raw sources keep `message`. Normalise to one field, and
    # give raw sources a level so Grafana's level colouring works everywhere.
    [FILTER]
        Name    modify
        Match   kube.*
        Rename  msg message
        Add     level info

    [OUTPUT]
        Name                    loki
        Match                   kube.*
        Host                    ${LOKI_HOST}
        Port                    ${LOKI_PORT}
        Uri                     ${LOKI_URI}
        {{- if .Values.fluentBit.loki.tenantId }}
        Tenant_ID               {{ .Values.fluentBit.loki.tenantId | quote }}
        {{- end }}
        Line_Format             json
        Labels                  job=fluent-bit, environment=${APP_ENV}, namespace=$kubernetes['namespace_name'], app=$kubernetes['labels']['app'], container=$kubernetes['container_name'], node=$kubernetes['host']
        # `level` stays in the JSON body (queryable with `| json | level=...`,
        # and Loki derives detected_level from it). Only keys NOT in the body go
        # to structured metadata.
        Structured_Metadata     pod=$kubernetes['pod_name'], stream=$stream
        Remove_Keys             kubernetes, logtag, _p, time
        Auto_Kubernetes_Labels  Off
        net.connect_timeout     5
        Retry_Limit             5

  parsers.conf: |
    [PARSER]
        Name         json_app
        Format       json
        Time_Key     time
        Time_Format  %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep    Off
{{- end }}
