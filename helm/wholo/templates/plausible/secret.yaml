{{- if .Values.plausible.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wholo.fullname" . }}-plausible
  labels:
    app: {{ include "wholo.fullname" . }}-plausible
type: Opaque
stringData:
  # `openssl rand -base64 64` — rotating it logs everyone out.
  SECRET_KEY_BASE: {{ required "plausible.secretKeyBase is required when plausible.enabled" .Values.plausible.secretKeyBase | quote }}
  # `openssl rand -base64 32` — encrypts stored 2FA secrets at rest.
  TOTP_VAULT_KEY: {{ required "plausible.totpVaultKey is required when plausible.enabled" .Values.plausible.totpVaultKey | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%d/%s" .Values.postgresql.username .Values.postgresql.password (include "wholo.postgresql.host" .) (int .Values.postgresql.port) .Values.plausible.databaseName | quote }}
  CLICKHOUSE_DATABASE_URL: {{ printf "http://%s-clickhouse:8123/plausible_events_db" (include "wholo.fullname" .) | quote }}
{{- end }}
