apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wholo.fullname" . }}-www
  labels:
    app: {{ include "wholo.fullname" . }}-www
type: Opaque
stringData:
  # Register-form email delivery. user/pass empty = no SMTP auth (MailHog).
  WWW_SMTP_USER: {{ .Values.www.smtp.user | quote }}
  WWW_SMTP_PASS: {{ .Values.www.smtp.password | quote }}
  # Internal recipient for lead submissions.
  LEADS_TO: {{ .Values.www.smtp.leadsTo | quote }}
