{{- if .Values.postgresql.backup.enabled }}
{{- $b := .Values.postgresql.backup }}
# R2 credentials + rclone crypt key for the off-cluster backup CronJob
# (ADR-069). The encryption password/salt must ALSO be kept outside the
# cluster — see values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wholo.fullname" . }}-pg-backup
  labels:
    app: {{ include "wholo.fullname" . }}-pg-backup
type: Opaque
stringData:
  r2AccountId: {{ required "postgresql.backup.r2.accountId is required when backups are enabled" $b.r2.accountId | quote }}
  r2Bucket: {{ required "postgresql.backup.r2.bucket is required when backups are enabled" $b.r2.bucket | quote }}
  r2Prefix: {{ $b.r2.prefix | default "postgres" | quote }}
  r2AccessKeyId: {{ required "postgresql.backup.r2.accessKeyId is required when backups are enabled" $b.r2.accessKeyId | quote }}
  r2SecretAccessKey: {{ required "postgresql.backup.r2.secretAccessKey is required when backups are enabled" $b.r2.secretAccessKey | quote }}
  encryptionPassword: {{ required "postgresql.backup.encryption.password is required when backups are enabled" $b.encryption.password | quote }}
  encryptionSalt: {{ required "postgresql.backup.encryption.salt is required when backups are enabled" $b.encryption.salt | quote }}
{{- end }}
