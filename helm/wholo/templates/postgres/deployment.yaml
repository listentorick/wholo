apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wholo.fullname" . }}-postgresql
  labels:
    app: {{ include "wholo.fullname" . }}-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "wholo.fullname" . }}-postgresql
  # Recreate: the RWO node-local volume can't be mounted by old and new pods
  # at once, so a rolling update would deadlock. rollingUpdate must be nulled
  # explicitly or upgrades of releases created before this change are rejected.
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    metadata:
      labels:
        app: {{ include "wholo.fullname" . }}-postgresql
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          # Run as the image's postgres user (UID/GID 70, Alpine) from the start.
          # Started as root, the entrypoint switches user with gosu, and on a node
          # running Ubuntu kernel 7.0.0-43 gosu hangs at that switch (reported
          # AppArmor signal-denial bug), so Postgres never starts. Starting as 70
          # skips gosu altogether. Existing data is already owned by 70.
          securityContext:
            runAsUser: 70
            runAsGroup: 70
          # timescaledb must be loaded at server start, not just CREATE EXTENSION'd —
          # the entrypoint's default CMD is bare `postgres`, so this is the standard
          # way to pass it a server config flag without a mounted postgresql.conf.
          args: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "max_connections=100"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wholo.fullname" . }}-postgresql
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Crash recovery (WAL replay) after an unclean stop can take a while;
          # liveness/readiness only start once this has passed once, so the
          # liveness probe can't kill Postgres mid-recovery and restart-loop it.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12   # up to 2 minutes to start
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}]
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wholo.fullname" . }}-postgresql
