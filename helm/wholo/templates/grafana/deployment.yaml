{{- if .Values.grafana.enabled }}
# In-cluster Grafana for local dev only (ADR-062). All state is provisioned
# from ConfigMaps, so /var/lib/grafana is an emptyDir — no PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wholo.fullname" . }}-grafana
  labels:
    app: {{ include "wholo.fullname" . }}-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "wholo.fullname" . }}-grafana
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    metadata:
      labels:
        app: {{ include "wholo.fullname" . }}-grafana
      annotations:
        checksum/provisioning: {{ include (print $.Template.BasePath "/grafana/configmap-provisioning.yaml") . | sha256sum }}
        checksum/dashboards: {{ include (print $.Template.BasePath "/grafana/configmap-dashboards.yaml") . | sha256sum }}
        checksum/alerting: {{ include (print $.Template.BasePath "/grafana/configmap-alerting.yaml") . | sha256sum }}
    spec:
      {{- include "wholo.imagePullSecrets" . }}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wholo.fullname" . }}-grafana
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: storage
          emptyDir: {}
        - name: provisioning
          configMap:
            name: {{ include "wholo.fullname" . }}-grafana-provisioning
        - name: dashboards
          configMap:
            name: {{ include "wholo.fullname" . }}-grafana-dashboards
        - name: alerting
          configMap:
            name: {{ include "wholo.fullname" . }}-grafana-alerting
{{- end }}
