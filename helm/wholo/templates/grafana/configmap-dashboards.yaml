{{- if .Values.grafana.enabled }}
# Every committed dashboard under helm/wholo/dashboards/ (ADR-062 order
# activity, ADR-063 platform health, …). Each file is the single source of
# truth — the same JSON the ops team imports into the external Grafana in live.
# Must live inside the chart dir; .Files.Get cannot read outside the chart root.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wholo.fullname" . }}-grafana-dashboards
  labels:
    app: {{ include "wholo.fullname" . }}-grafana
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
