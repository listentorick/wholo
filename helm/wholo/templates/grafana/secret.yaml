{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wholo.fullname" . }}-grafana
  labels:
    app: {{ include "wholo.fullname" . }}-grafana
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: {{ required "grafana.adminPassword is required when grafana.enabled" .Values.grafana.adminPassword | quote }}
{{- end }}
