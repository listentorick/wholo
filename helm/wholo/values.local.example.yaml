# Copy this file to values.local.yaml and customise for your local environment.
# values.local.yaml is gitignored.

postgresql:
  password: wholo

redis: {}

api:
  image:
    pullPolicy: Never
  jwt:
    secret: "local-dev-secret-do-not-use-in-prod"

portal:
  apiUrl: "http://localhost:3001"

keycloak:
  adminPassword: admin

# Order-activity telemetry (ADR-062). Locally the whole pipeline runs in-cluster:
# apps/api -> Telegraf (UDP :8125) -> InfluxDB 2 -> Grafana. Grafana UI:
#   http://localhost:30300  (admin / grafana.adminPassword)
appEnv: "local"
telegraf:
  enabled: true
  # Core platform-health metrics (ADR-063): RBAC + kube_inventory + http_response
  # + the telegraf-node DaemonSet + the stocdup-platform-health dashboard.
  platformHealth:
    enabled: true
influxdb:
  enabled: true
  adminPassword: "local-influx-admin"
  adminToken: "local-influx-token-change-me"
grafana:
  enabled: true
  adminPassword: "admin"
