# Pull secrets for private registries (e.g. ghcr.io in live). Empty for
# local dev, where images are built straight into the Docker Desktop daemon.
imagePullSecrets: []

# Deployment environment name. Surfaced to apps/api as APP_ENV and used as the
# `environment` tag on order-activity metrics (ADR-062). "local" | "live".
appEnv: "local"

# Structured logging (ADR-064). pino level for all 5 Node processes — one JSON
# line per event to stdout, shipped to Loki by Fluent Bit.
# error | warn | info | debug | trace
logging:
  level: "info"

# Browser-facing base URLs for the portal/admin apps — the single source
# of truth for every consumer that builds a link a browser follows: email
# links (apps/api), the order-as magic link (admin-api), and Keycloak's
# realm client redirect URIs/web origins. Must be reachable from a
# recipient's/user's browser — never point either at internal service DNS.
global:
  portalUrl: "http://localhost:3010"
  adminUrl: "http://localhost:3020"
  driverUrl: "http://localhost:3030"

postgresql:
  # TimescaleDB-enabled Postgres 16 image (same major version as the prior
  # postgres:16-alpine — existing PVC data is binary-compatible, only the
  # timescaledb extension .so is added). Pinned, not `latest-pg16`, matching
  # this repo's own "never deploy latest" convention.
  image: timescale/timescaledb:2.17.2-pg16
  port: 5432
  database: wholo
  username: wholo
  password: wholo
  storageSize: 1Gi
  # Empty = cluster default StorageClass (Docker Desktop: hostpath, k3s: local-path)
  storageClass: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # Nightly pg_dumpall to a dedicated PVC. Protects against app-level
  # corruption and accidental deletion — not node-disk loss (dumps live on
  # the same cluster's node-local storage).
  backup:
    enabled: false
    schedule: "0 2 * * *"
    storageSize: 2Gi

redis:
  image: redis:7-alpine
  port: 6379
  storageSize: 512Mi
  storageClass: ""
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

api:
  image:
    repository: wholo/api
    tag: local
    pullPolicy: Never
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 3001
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  r2:
    accountId: ""
    bucketName: ""
    deliveryBucketName: ""
    publicBaseUrl: ""
    accessKeyId: ""
    secretAccessKey: ""
  # Defaults target the in-cluster MailHog; override for a real provider.
  # user/password empty = no SMTP auth (MailHog default).
  smtp:
    user: ""
    password: ""
    # From address for invite emails specifically; falls back to smtp.from
    # if unset. Lets invites ride a separately-verified sending address
    # (e.g. one already proven to work via Keycloak) independent of the
    # address used for order notification emails.
    inviteFrom: ""
    # Support contact shown in the invite email's "need help using Stocdup?"
    # line — a platform-level contact, distinct from the distributor's own.
    supportEmail: "support@stocdup.com"
  xero:
    clientId: ""
    clientSecret: ""
    # Must match the redirect URI registered in the Xero developer app exactly.
    # This is apps/admin-api's public callback route (the admin app's own
    # origin), not a route on apps/api itself — apps/api must never be given
    # a public ingress route for this; see xero-connection.adapter.ts.
    # Xero requires HTTPS even for local testing — values.local.yaml overrides
    # this to an https://admin.localhost:... URL; see scripts/setup-local-xero-https.sh.
    redirectUri: "http://localhost:3020/api/v1/accounting/xero/callback"
  # 32-byte key, base64-encoded (e.g. `openssl rand -base64 32`) — encrypts
  # stored accounting OAuth tokens at rest.
  accountingTokenEncryptionKey: ""
  # 32-byte key, base64-encoded (e.g. `openssl rand -base64 32`) — HMAC-signs
  # driver delivery-link tokens (see ADR-059). Rotating it invalidates every
  # outstanding, unsubmitted delivery link at once.
  deliveryTokenSigningKey: ""
  # Seeds demo data on every install/upgrade. Must be disabled in live.
  seedJob:
    enabled: true

# Outbox publisher + queue consumers. Runs the api image with a different
# entry point. Must stay at 1 replica: the outbox relay relies on being the
# only publisher (ADR-047).
worker:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

portalApi:
  image:
    repository: wholo/portal-api
    tag: local
    pullPolicy: Never
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 3010
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "500m"
  centralApiUrl: "http://wholo-api:3001"

driverApi:
  image:
    repository: wholo/driver-api
    tag: local
    pullPolicy: Never
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 3030
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "500m"
  centralApiUrl: "http://wholo-api:3001"

adminApi:
  image:
    repository: wholo/admin-api
    tag: local
    pullPolicy: Never
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 3020
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "500m"
  centralApiUrl: "http://wholo-api:3001"

# Public marketing site (www.stocdup.com). Standalone Next.js, no BFF, no
# calls to apps/api. Only outbound dependency is SMTP for the register form.
www:
  image:
    repository: wholo/www
    tag: local
    pullPolicy: Never
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 3040
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "500m"
  # Browser-facing canonical URL — absolute links in metadata/OG/sitemap.
  siteUrl: "http://localhost:3040"
  # Register-form email. Empty host/port/secure fall back to the in-cluster
  # MailHog (plain, unauthenticated, 1025). Set a real provider in live.
  smtp:
    host: ""
    port: ""
    secure: ""
    user: ""
    password: ""
    from: "leads@stocdup.com"
    leadsTo: "leads@stocdup.com"

# Self-hosted analytics for the marketing site. Off by default (local dev has
# no need for ClickHouse); the www app's analytics is a no-op when absent.
# Enable in values.live.yaml. Dashboard is ClusterIP-only:
#   kubectl -n wholo port-forward svc/wholo-plausible 8000:8000
plausible:
  enabled: false
  # Pin an exact release; verify against ghcr.io/plausible/community-edition tags.
  image: ghcr.io/plausible/community-edition:v3.0.1
  # Database on the shared Postgres (events go to ClickHouse, not here).
  databaseName: plausible
  baseUrl: "https://www.stocdup.com"
  disableRegistration: "invite_only"
  # openssl rand -base64 64  /  openssl rand -base64 32  — set in values.live.yaml.
  secretKeyBase: ""
  totpVaultKey: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "700Mi"
      cpu: "500m"

clickhouse:
  image: clickhouse/clickhouse-server:24.12-alpine
  storageSize: 3Gi
  storageClass: ""
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1500Mi"
      cpu: "1000m"

mailhog:
  image: mailhog/mailhog:v1.0.1
  service:
    # NodePort 30825 for the UI in local dev; live uses ClusterIP and
    # port-forward (the UI has no auth — never expose it publicly).
    type: NodePort
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# ── Order-activity telemetry (ADR-062) ──────────────────────────────────────
# apps/api emits StatsD counters over UDP -> Telegraf aggregates -> InfluxDB 2
# -> Grafana renders the "Stocdup Order Activity" dashboard.
#
#   Live : InfluxDB 2 + Grafana are external (ops monitoring host). Only
#          Telegraf runs in-cluster; telegraf.influx.url points at the
#          external InfluxDB. influxdb.enabled / grafana.enabled stay false.
#   Local: enable all three in values.local.yaml to run the whole pipeline
#          on Docker Desktop.
telegraf:
  enabled: false
  image: telegraf:1.32-alpine
  # Documented StatsD aggregation + flush cadence.
  flushInterval: "10s"
  # ── Core platform-health metrics (PBI-1 / ADR-063) ────────────────────────
  # Layered on the same Telegraf → InfluxDB path. When enabled:
  #   - the Telegraf Deployment additionally runs inputs.http_response (per-API
  #     availability self-checks) and inputs.kube_inventory (pod status /
  #     restarts), which needs the chart's first RBAC — a read-only
  #     ServiceAccount + ClusterRole (get/list/watch on pods, nodes, namespaces,
  #     services, and apps/* workloads);
  #   - a `telegraf-node` DaemonSet runs on every node with read-only hostPath
  #     mounts (/proc, /sys, rootfs) for node CPU / memory / disk %;
  #   - Grafana provisions the second committed dashboard,
  #     stocdup-platform-health.json.
  # Off by default; enabled in BOTH values.local.yaml and values.live.yaml (it
  # needs no infra beyond the InfluxDB Telegraf already writes to).
  platformHealth:
    enabled: false
    # DaemonSet image; blank ⇒ reuse telegraf.image.
    nodeImage: ""
    nodeResources:
      requests:
        memory: "48Mi"
        cpu: "15m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  influx:
    # Blank -> the in-cluster InfluxDB service. Live: the ops host, e.g.
    # http://192.168.1.15:8086
    url: ""
    org: "stocdup"
    bucket: "stocdup_metrics"
    # Blank -> reuse influxdb.adminToken (local). Live: a write-scoped token,
    # real value only in the gitignored values.live.yaml.
    token: ""
  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "192Mi"
      cpu: "150m"

influxdb:
  # In-cluster InfluxDB 2 for local dev only. Live uses an external instance.
  enabled: false
  image: influxdb:2.7-alpine
  org: "stocdup"
  bucket: "stocdup_metrics"
  retention: "90d"
  adminUser: "admin"
  # Set both in values.local.yaml. adminToken also feeds Telegraf and Grafana
  # locally whenever their own token fields are left blank.
  adminPassword: ""
  adminToken: ""
  storageSize: 1Gi
  storageClass: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

grafana:
  # In-cluster Grafana for local dev only. Live uses an external instance --
  # import helm/wholo/dashboards/stocdup-order-activity.json into it by hand.
  enabled: false
  image: grafana/grafana:11.2.0
  adminUser: "admin"
  adminPassword: ""
  service:
    # NodePort 30300 for the UI in local dev.
    type: NodePort
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "300m"

# ── Log aggregation (ADR-064) ──────────────────────────────────────────────
# fluent-bit (a node DaemonSet) tails every pod's container logs in the wholo
# namespace and pushes them to Loki. The 5 Node processes emit structured JSON
# (nestjs-pino); www/keycloak/postgres/redis/etc. ship raw, labelled.
#   Local: loki.enabled + fluentBit.enabled — both in-cluster.
#   Live : loki.enabled=false; fluentBit.loki.host = the ops host (192.168.1.15).

loki:
  # In-cluster single-binary Loki for local dev only. Live uses the external
  # ops-host Loki — keep this false in values.live.yaml.
  enabled: false
  image: grafana/loki:3.7.7      # needs >= 3.0 for structured metadata
  retention: "72h"
  storageSize: 2Gi
  storageClass: ""
  resources:
    requests:
      memory: "192Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "400m"

fluentBit:
  # Node log-shipping DaemonSet. Runs in every environment when enabled.
  enabled: false
  image: fluent/fluent-bit:5.1.2
  # Container-log format: "cri" (containerd — live k3s) or "docker" (cri-dockerd
  # json-file — Docker Desktop). Overridden to "docker" in values.local.yaml.
  multilineParser: "cri"
  loki:
    host: ""                     # blank -> the in-cluster wholo-loki service
    port: 3100
    uri: "/loki/api/v1/push"
    tenantId: ""                 # multi-tenant Loki only
  # hostPath position DB so tail offsets survive a pod restart (an emptyDir
  # would re-read every file after each restart -> duplicate lines in Loki).
  positionsHostPath: "/var/lib/wholo-fluent-bit"
  resources:
    requests:
      memory: "48Mi"
      cpu: "15m"
    limits:
      memory: "128Mi"
      cpu: "100m"

keycloak:
  image:
    repository: wholo/keycloak
    tag: local
    pullPolicy: Never
  adminUser: admin
  adminPassword: admin
  # Secret of the `wholo-api-admin` service-account client the worker uses to
  # disable removed team members' Keycloak logins (ADR-067). Local default
  # only — set a real random value in values.live.yaml. Like everything in the
  # realm, import is first-boot-only: on an existing realm run
  # scripts/setup-keycloak-api-admin-client.sh instead.
  apiAdminClientSecret: local-wholo-api-admin-secret
  port: 8080
  # Realm name is an internal identifier baked into browser bundles as
  # NEXT_PUBLIC_KEYCLOAK_REALM (repo var LIVE_KEYCLOAK_REALM for live images)
  # — the two MUST agree. Import is first-boot-only: changing this on an
  # existing install requires a realm delete/re-import (or namespace wipe).
  realm: wholo
  realmDisplayName: Wholo
  # Shared across local and live — realm import only happens on first boot,
  # so changes here don't propagate to an existing realm; apply the same
  # string via the Keycloak Admin Console (Authentication → Policies) on any
  # already-running realm.
  passwordPolicy: "length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and notUsername and notEmail"
  service:
    type: LoadBalancer
  # "start-dev" for local; "start" (production mode) in live.
  startCommand: start-dev
  # KC_HOSTNAME. Live sets a full URL (https://auth.<domain>), which makes
  # hostnamePort irrelevant — set hostnamePort: "" there.
  hostname: "localhost"
  hostnamePort: "8080"
  # Set to "xforwarded" when running behind a TLS-terminating proxy (Traefik).
  proxyHeaders: ""
  # SMTP settings for realm emails (verification, reset). Empty defaults
  # preserve the in-cluster MailHog behavior (plain, unauthenticated, port 1025).
  smtpHost: ""
  smtpPort: ""
  smtpSsl: ""
  smtpStartTls: ""
  smtpAuthEnabled: ""
  smtpUser: ""
  smtpPassword: ""
  # From address for realm emails; falls back to api.smtp.from if unset.
  smtpFrom: ""
  # Demo users with weak passwords, for local dev only. Never enable in live.
  seedUsers: true
  # First boot (Quarkus augmentation + DB migration + realm import all at
  # once) is memory-hungry — 1Gi was getting OOMKilled repeatedly on live
  # during a fresh install before settling. Give it headroom for that spike.
  resources:
    requests:
      memory: "768Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

ingress:
  enabled: false
  className: traefik
  annotations: {}
  # Serve TLS at Traefik from the `<release>-tls` secret. Set false when TLS
  # terminates upstream of the cluster (e.g. an external WAF/proxy that
  # forwards plain HTTP to Traefik) — the ingress then declares no tls block.
  tls: true
  hosts:
    portal: ""
    admin: ""
    driver: ""
    www: ""
    api: ""
    auth: ""
    # Internal-only host for health checks (admin-api/portal-api/apps-api),
    # never Cloudflare-proxied — resolved only on the operator's LAN/VPN.
    # See `healthAccess:` below, which gates the IP allowlist on it.
    health: ""

# Restricts /api/v1/health* to an IP allowlist: on the admin/portal hosts
# (where it's otherwise public) and on the dedicated `ingress.hosts.health`
# host. Off by default — no allowlist mechanism exists without this enabled.
healthAccess:
  enabled: false
  # CIDR list, e.g. ["192.168.1.15/32", "10.0.0.5/32"]. Only meaningful when
  # traffic reaches Traefik with the real client IP intact (i.e. bypasses
  # any upstream proxy/WAF that would mask it) — see values.live.example.yaml.
  allowedIPs: []
