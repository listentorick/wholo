# Live environment (self-hosted k3s) — see docs/runbook/README.md
#
# Copy to values.live.yaml (gitignored), replace every <domain>, <sha> and
# CHANGE_ME, then deploy with:
#   helm upgrade --install wholo helm/wholo -n wholo -f helm/wholo/values.live.yaml
#
# Notes:
# - portal-api/admin-api images bake NEXT_PUBLIC_KEYCLOAK_* into the JS bundle
#   at build time. They must have been built by CI with
#   LIVE_KEYCLOAK_URL=https://auth.<domain> — the chart cannot fix a wrong
#   baked-in URL.
# - Pin an immutable sha- tag from the build-images workflow; never :latest.

imagePullSecrets:
  - name: ghcr-pull   # created once per the runbook (GHCR packages are private)

postgresql:
  password: "CHANGE_ME_strong_password"
  storageSize: 5Gi
  # Encrypted off-cluster backups to R2 every 6h (ADR-069). One-time setup
  # (bucket, 3-day lifecycle rule, scoped token) is in docs/runbook/setup/backups.md.
  backup:
    enabled: true
    r2:
      accountId: "CHANGE_ME"
      bucket: "stocdup-db-backups"
      accessKeyId: "CHANGE_ME"           # token scoped to the backup bucket only
      secretAccessKey: "CHANGE_ME"
    # openssl rand -base64 32 — each. ALSO store both in the password manager:
    # a restore after cluster loss is impossible without them.
    encryption:
      password: "CHANGE_ME"
      salt: "CHANGE_ME"

redis:
  storageSize: 1Gi

# Single source of truth for the two browser-facing URLs: admin-api's
# order-as magic link, apps/api's email links, and Keycloak's realm client
# redirect URIs/web origins all read these.
global:
  portalUrl: "https://portal.<domain>"
  adminUrl: "https://admin.<domain>"
  # Driver PWA host — apps/api builds QR delivery URLs from this. Must match
  # ingress.hosts.driver below.
  driverUrl: "https://driver.<domain>"

api:
  image:
    repository: ghcr.io/listentorick/wholo/api
    tag: sha-CHANGE_ME
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  seedJob:
    enabled: false          # never seed demo data into live
  smtp:
    from: "notifications@<domain>"
    inviteFrom: "noreply@<domain>"
  r2:
    accountId: "CHANGE_ME"
    bucketName: "CHANGE_ME"
    deliveryBucketName: "CHANGE_ME"
    publicBaseUrl: "CHANGE_ME"
    accessKeyId: "CHANGE_ME"
    secretAccessKey: "CHANGE_ME"
  xero:
    clientId: "CHANGE_ME"
    clientSecret: "CHANGE_ME"
    # Must be registered EXACTLY (https, host, path) in the Xero developer
    # app. This is admin-api's public callback route via the admin ingress
    # host — never a route on apps/api (see xero-connection.adapter.ts).
    redirectUri: "https://admin.<domain>/api/v1/accounting/xero/callback"
  # 32-byte key, base64-encoded (openssl rand -base64 32) — encrypts stored
  # accounting OAuth tokens at rest. Changing it orphans stored tokens.
  accountingTokenEncryptionKey: "CHANGE_ME"

portalApi:
  image:
    repository: ghcr.io/listentorick/wholo/portal-api
    tag: sha-CHANGE_ME
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP

adminApi:
  image:
    repository: ghcr.io/listentorick/wholo/admin-api
    tag: sha-CHANGE_ME
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP

driverApi:
  image:
    repository: ghcr.io/listentorick/wholo/driver-api
    tag: sha-CHANGE_ME
    pullPolicy: IfNotPresent
  service:
    # Fronted by the Traefik ingress (ingress.hosts.driver), like portal/admin.
    type: ClusterIP

www:
  image:
    repository: ghcr.io/listentorick/wholo/www
    tag: sha-CHANGE_ME
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  siteUrl: "https://www.<domain>"
  # Register-form email — same provider as api.smtp (PurelyMail), ideally a
  # dedicated sending address. Real password goes in the gitignored
  # values.live.yaml, not here.
  smtp:
    host: "smtp.purelymail.com"
    port: "587"
    secure: "false"
    user: "CHANGE_ME"
    password: "CHANGE_ME"
    from: "leads@<domain>"
    leadsTo: "CHANGE_ME@<domain>"

# Self-hosted analytics for www. Dashboard: kubectl -n wholo port-forward
# svc/wholo-plausible 8000:8000 (register the first user, then it's invite-only).
plausible:
  enabled: true
  baseUrl: "https://www.<domain>"
  secretKeyBase: "CHANGE_ME_openssl_rand_base64_64"
  totpVaultKey: "CHANGE_ME_openssl_rand_base64_32"

mailhog:
  service:
    # The MailHog UI has no auth — keep it off the internet. View it with:
    #   kubectl -n wholo port-forward svc/wholo-mailhog 8025:8025
    type: ClusterIP

# Order-activity telemetry (ADR-062). InfluxDB 2 + Grafana run on the ops
# monitoring host, NOT in the cluster — only Telegraf runs here, writing out to
# the external InfluxDB. One-time infra-owner setup (bucket, retention, write
# token, Grafana datasource + dashboard import) is in docs/runbook/setup/telemetry.md.
appEnv: "live"
telegraf:
  enabled: true
  # Core platform-health metrics (ADR-063). Adds a read-only ClusterRole/Binding
  # + a telegraf-node DaemonSet (read-only hostPath, NOT privileged, no
  # kubelet :10250 dependency). Import helm/wholo/dashboards/
  # stocdup-platform-health.json into the ops Grafana by hand, same as the
  # order-activity dashboard. See docs/runbook/setup/telemetry.md.
  platformHealth:
    enabled: true
  influx:
    url: "http://influxdb.home.arpa:8086"   # ops-host InfluxDB 2 (must resolve + be reachable from pods)
    org: "Parsnips"
    bucket: "stocdup"                        # dashboards + alert rules query this name
    token: "CHANGE_ME_influx_write_token"   # real value only in gitignored values.live.yaml
influxdb:
  enabled: false                       # external in live
grafana:
  enabled: false                       # external in live

# Log aggregation (ADR-064). Only the fluent-bit DaemonSet runs in-cluster; it
# pushes to the ops-host Loki. loki.enabled stays false (external). One-time
# infra-owner setup (run/point Loki, retention, node egress to :3100, Grafana
# Loki datasource + dashboard import) is in docs/runbook/setup/logging.md.
loki:
  enabled: false                       # external in live
fluentBit:
  enabled: true
  loki:
    host: "loki.home.arpa"             # ops-host Loki (must resolve + be reachable from pods)
    port: 3100
    uri: "/loki/api/v1/push"

keycloak:
  image:
    repository: ghcr.io/listentorick/wholo/keycloak
    tag: sha-CHANGE_ME
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  adminPassword: "CHANGE_ME_strong_password"
  # Secret for the `wholo-api-admin` service-account client the worker uses to
  # disable removed team members' Keycloak logins. Generate a long random value
  # (e.g. `openssl rand -hex 32`). Must match what you pass to
  # scripts/setup-keycloak-api-admin-client.sh on an existing realm.
  apiAdminClientSecret: "CHANGE_ME_long_random_secret"
  # Keep the realm NAME brand-neutral (e.g. prod) — it is baked into browser
  # bundles (LIVE_KEYCLOAK_REALM must equal it) and into every token issuer,
  # so renaming after launch is painful. Branding lives in realmDisplayName,
  # editable any time in the Keycloak console.
  realm: prod
  realmDisplayName: "CHANGE_ME brand name"
  startCommand: start       # production mode
  hostname: "https://auth.<domain>"
  hostnamePort: ""          # unused when hostname is a full URL
  proxyHeaders: xforwarded  # TLS terminates upstream (WAF); headers forwarded
  seedUsers: false          # demo users must never reach a public auth server

ingress:
  enabled: true
  className: traefik
  annotations: {}
  # TLS terminates upstream (Cloudflare -> WAF appliance); Traefik receives
  # plain HTTP — see docs/runbook/setup/cluster.md and
  # deploy/live/traefik-config.yaml.
  tls: false
  hosts:
    portal: portal.<domain>
    admin: admin.<domain>
    auth: auth.<domain>
    # Public marketing site. The bare apex (<domain>) is handled by a
    # Cloudflare Redirect Rule -> https://www.<domain>; the cluster only
    # serves www. (`*.<domain>` Origin CA cert covers www, not the apex.)
    www: www.<domain>
    # Driver PWA (QR delivery flow + authenticated manifest). Must match
    # global.driverUrl so apps/api mints QR delivery URLs on this host.
    driver: driver.<domain>
    # apps/api is deliberately not exposed publicly — BFFs reach it via
    # cluster DNS. Only add an api host (plus its DNS A record) if external
    # webhooks ever need it:
    # api: api.<domain>
    # Internal-only — an internal DNS record (NOT Cloudflare-proxied,
    # resolvable only on the operator's LAN/VPN) must point this at the k3s
    # node directly, bypassing Cloudflare/the WAF. This is what lets
    # healthAccess.allowedIPs below see real source IPs instead of the WAF's.
    health: health.<domain>

# Restricts apps/api, admin-api, and portal-api's /api/v1/health* to these
# IPs only — on the admin/portal public hosts (otherwise public there) and
# on the health.<domain> host above. Put the real CIDRs in the gitignored
# values.live.yaml, not here.
healthAccess:
  enabled: true
  allowedIPs:
    - "CHANGE_ME/32" # e.g. monitoring server
    - "CHANGE_ME/32" # e.g. VPN peer
