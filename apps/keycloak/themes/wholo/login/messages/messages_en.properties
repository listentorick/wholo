# Overrides of Keycloak's login messages (the rest come from the parent theme).

# Shown on the choose-password page. Since Keycloak 26.7 a new account lands
# there after verifying its email, so "change your password" no longer fits.
# The same page also serves password resets.
updatePasswordMessage=Choose a password for your account.

# The email is the username in this realm, so either policy check means the
# same thing to the user. The choose-password page can't check this as they
# type (Keycloak doesn't give it the email), so this error is their only cue.
invalidPasswordNotEmailMessage=Your password can''t be your email address.
invalidPasswordNotUsernameMessage=Your password can''t be your email address.
