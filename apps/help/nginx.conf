# Stocdup help site (ADR-080): serves the static Docusaurus build.
# Runs as the unprivileged nginx user, so it listens on 3060, not 80.
server {
    listen 3060;
    server_name _;
    root /usr/share/nginx/html;

    # Liveness/readiness probe target; never logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed bundles: safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages: /accept-order resolves to accept-order.html (trailingSlash: false).
    # A trailing slash redirects to the canonical slashless URL. Relative so the
    # redirect keeps the visitor's scheme and host behind Cloudflare/Traefik.
    absolute_redirect off;
    location / {
        rewrite ^(/.+)/$ $1 permanent;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
